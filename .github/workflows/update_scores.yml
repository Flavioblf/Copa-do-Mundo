name: Atualizar Resultados Copa 2026

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 08:00 BRT (UTC-3)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar resultados
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/update_scores.py

      - name: Commit e push (somente se houve mudanças)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/calendar_2026.json
          git diff --staged --quiet && echo "Sem alterações." || (
            git commit -m "chore: resultados $(date -u +'%Y-%m-%d')" &&
            git push
          )
